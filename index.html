<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dance UP Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script defer src="config.js"></script>
<style>
.top{margin:10px 12px 0;border-radius:18px;border:0;width:auto;box-sizing:border-box}
#dback{position:fixed;inset:0;background:#231B3A40;z-index:19;display:none}#dback.open{display:block}
.pg{display:inline-flex;align-items:center;gap:10px}
.pgrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.pgrow p{margin:0}
.top nav{display:flex}.top nav button{font:inherit;color:var(--brand-ink);background:none;border:0;padding:8px 14px;border-radius:8px;cursor:pointer}
.top nav button.on{background:var(--brand-ink);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 8px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left}
.row:hover{background:#F6F4FB}.row:first-child{border-top:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.back{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0 0 10px}
#drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100%;background:#fff;border-left:1px solid var(--line);padding:22px;overflow:auto;transform:translateX(100%);transition:transform .2s;z-index:20;box-shadow:-8px 0 24px #231B3A22}
#drawer.open{transform:none}
#drawer dl{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;margin:14px 0}#drawer dt{color:var(--mute);font-size:.9rem}#drawer dd{margin:0}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline}
.tg{font:inherit;font-weight:600;min-width:80px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
.tg.yes{background:var(--ok);border-color:var(--ok);color:#fff}.tg.no{background:var(--warn);border-color:var(--warn);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.chips button{font:inherit;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;white-space:nowrap}.chips .on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.ed{min-width:2600px}.ed td{padding:3px 4px}.ed input{width:100%;min-width:110px;border:1px solid transparent;background:transparent;padding:6px 8px}.ed input:hover,.ed input:focus{border-color:var(--line);background:#fff}
@media(max-width:700px){.ed{min-width:0}.ed thead{display:none}.ed tr{display:block;border:1px solid var(--line);border-radius:10px;margin:0 0 12px;padding:8px}.ed td{display:flex;gap:8px;align-items:center;border:0;padding:3px 0}.ed td::before{content:attr(data-label);flex:0 0 92px;color:var(--mute);font-size:.82rem}.ed td input{min-width:0}}
.fl{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.fl label{display:flex;flex-direction:column;font-size:.82rem;color:var(--mute);gap:3px}.fl input,.fl select{min-width:120px}
.btn.big{font-size:1.1rem;padding:16px 28px}.cbtn{padding:6px 12px;font-size:.9rem;white-space:nowrap}
.ta{width:100%;resize:none;overflow:hidden;font:inherit;line-height:1.35;padding:6px 8px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--ink)}.ta:hover,.ta:focus{border-color:var(--line);background:#fff}
.ed td[data-label=""]::before{display:none}.ed td textarea.ta{min-width:0!important}
.ov{position:fixed;inset:0;background:#10261F88;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:40}
.mdl{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px}.mdl label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--mute)}.mdl input,.mdl select,.mdl textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink);width:100%}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:30}
@media(max-width:700px){.top{padding:12px 16px}.top nav{position:fixed;bottom:0;left:0;right:0;background:var(--brand);justify-content:space-around;padding:6px;z-index:10}.top nav button{padding:10px 6px;font-size:.78rem}main{padding-bottom:90px}
#drawer{top:auto;width:100%;max-height:85vh;border-left:0;border-radius:16px 16px 0 0;transform:translateY(100%)}#drawer.open{transform:none}}
.dpk{position:relative;display:inline-flex;align-items:center;min-width:150px;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;box-sizing:border-box}.dpk .ph{color:var(--accent);font-weight:600}.dpk input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.tsel{display:inline-flex;align-items:center;gap:4px}.tsel select{min-width:70px}
</style></head><body>
<header class="top"><b>Dance UP Studio</b><nav id="nav"></nav></header>
<main class="page" id="v"></main>
<div id="dback" onclick="S.drawer=null;drawer()"></div><aside id="drawer" aria-label="Карточка"></aside><div id="toast"></div><div id="modal"></div>
<script>
/* ===== данные (загружаются из Supabase) ===== */
let T=[],G=[],P=[],K=[],EN=[],A={};
let AX=null,ATT_OK=false,ATT_ERR=false,KI={},GI={};
function axB(){const kg=new Map(),bk=new Map();for(const key in A){const [k,g,d]=key.split('|'),id=k+'|'+g;let m=kg.get(id);if(!m){m=new Map();kg.set(id,m)}m.set(d,A[key]);let s=bk.get(+k);if(!s){s=new Set();bk.set(+k,s)}s.add(+g)}AX={kg,bk}}
const getAX=()=>{if(!AX)axB();return AX};
function setA(key,v){if(v===undefined)delete A[key];else A[key]=v;if(!AX)return;const [k,g,d]=key.split('|'),id=k+'|'+g;let m=AX.kg.get(id);
if(v===undefined){if(m){m.delete(d);if(!m.size){AX.kg.delete(id);const s=AX.bk.get(+k);if(s)s.delete(+g)}}return}
if(!m){m=new Map();AX.kg.set(id,m)}m.set(d,v);let s=AX.bk.get(+k);if(!s){s=new Set();AX.bk.set(+k,s)}s.add(+g)}
const attWait=()=>'<section class="card"><p class="muted">'+(ATT_ERR?'Не удалось загрузить посещаемость. Обновите страницу.':'Загружаем посещаемость…')+'</p></section>';
let TU={},GU={},PU={},KU={},EU={},LS={},ME=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const grow=e=>{e.style.height='auto';e.style.height=(e.scrollHeight+2)+'px'};
const today=()=>new Date().toISOString().slice(0,10);
const fmt=s=>s?s.split('-').reverse().join('.'):'—';
const age=d=>d?Math.max(0,Math.floor((Date.now()-new Date(d))/31557600000)):'';
const ageOf=k=>k.dobI?age(k.dobI):(/^\d{4}$/.test((k.bdr||'').trim())?new Date().getFullYear()-(+k.bdr.trim()):'');
const IS_ADMIN=()=>!!ME&&ME.role==='admin';
const IX={t:new Map(),g:new Map(),k:new Map(),p:new Map()};
function reindex(){IX.t=new Map(T.map(x=>[x.id,x]));IX.g=new Map(G.map(x=>[x.id,x]));IX.k=new Map(K.map(x=>[x.id,x]));IX.p=new Map(P.map(x=>[x.id,x]))}
const COL=new Intl.Collator('ru');
const tn=id=>((IX.t.get(+id)||T.find(t=>t.id==id))||{}).n||'';
const gById=id=>IX.g.get(+id)||G.find(x=>x.id==id);
const kById=id=>IX.k.get(+id)||K.find(x=>x.id==id);
const pById=id=>IX.p.get(+id)||P.find(x=>x.id==id)||null;
function growAll(){const l=document.querySelectorAll('textarea.ta');if(!l.length)return;for(const e of l)e.style.height='auto';const h=[];for(const e of l)h.push(e.scrollHeight+2);l.forEach((e,i)=>{e.style.height=h[i]+'px'})}
let _dt;const drawD=()=>{clearTimeout(_dt);_dt=setTimeout(()=>draw(1),180)};
const openK=id=>{S.drawer=id;drawer()};
let _pdfP;const loadPdf=()=>window.html2pdf?Promise.resolve():(_pdfP=_pdfP||new Promise((ok,no)=>{const e=document.createElement('script');e.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';e.onload=ok;e.onerror=()=>{_pdfP=null;no(new Error('не удалось загрузить модуль PDF'))};document.head.appendChild(e)}));
const gn=id=>{const g=gById(id);return g?tn(g.t)+' · '+g.n+(g.season?' ('+g.season+')':''):''};
const ST={active:'Активен',reserve:'Резерв',left:'Выбыл'};
const monthRange=()=>{const d=new Date(),y=d.getFullYear(),m=d.getMonth();return [new Date(Date.UTC(y,m,1)).toISOString().slice(0,10),new Date(Date.UTC(y,m+1,0)).toISOString().slice(0,10)]};
const S={tab:'kids',t:null,g:null,gv:'kids',drawer:null,tq:'',tc:'',a1:'',a2:'',ts:'az',pp:100,tp:0,ty:'',tt:0,tf:0,tst:'',pk:0,from:monthRange()[0],to:monthRange()[1],ad:today(),gq:'',cg:false,amt:'',gfq:'',ga:false,pq:''};
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2800)}
function go(tab,o={}){Object.assign(S,{tab,gv:'kids',gq:'',gfq:'',ga:false,pq:'',gd:null},o);S.drawer=null;draw()}
const priceOn=(g,d)=>{const x=gById(g);let p=0;if(x)for(const h of x.ph)if(h.f<=d)p=h.p;return p};
const curPrice=g=>{let p=0;const t=today();for(const h of g.ph)if(h.f<=t)p=h.p;return p};
const rowsOf=g=>EN.filter(e=>e.g==g);
const activeIn=g=>EN.filter(e=>e.g==g&&e.st=='active');
const enOf=(k,g)=>EN.find(e=>e.k==k&&e.g==g);

/* ===== вкладки ===== */
const TABS=[['kids','Ученики'],['groups','Группы'],['teachers','Преподаватели'],['pay','Оплаты']];
const kidRow=k=>`<button class="row" onclick="openK(${k.id})"><span>${esc(k.n)}</span><span class="muted">${esc(EN.filter(e=>e.k==k.id&&e.st=='active').map(e=>(gById(e.g)||{}).n).join(', '))}</span></button>`;
const gKid=e=>{const k=kById(e.k);return `<div class="row" style="cursor:default"><button class="lnk" style="text-decoration:none;color:inherit;text-align:left" onclick="openK(${k.id})">${esc(k.n)}${e.st!='active'?` <span class="chip due">${ST[e.st]}</span>`:''}</button>${IS_ADMIN()&&e.st=='active'?`<button class="lnk" onclick="rmFromGroup(${e.k},${e.g})">убрать</button>`:''}</div>`};

function view(){const t=S.tab,ad=IS_ADMIN();
if(t=='kids')return kidsView(ad);
if(t=='groups'){if(S.g)return groupPage(S.g);return `<h1>Группы</h1>${ad?`<div class="bar"><button class="btn big" onclick="S.cg=!S.cg;draw()">+ Создать группу</button></div>${S.cg?groupForm():''}`:''}<section class="card"><div class="bar"><input id="gfq" type="search" value="${esc(S.gfq)}" placeholder="Поиск: название группы или преподаватель" autocomplete="off" style="flex:1;min-width:240px" oninput="S.gfq=this.value;gr()"></div><div id="gres">${groupsRes()}</div></section>`}
if(t=='teachers'){if(S.g)return groupPage(S.g);
if(S.t)return `<section class="card"><button class="back" onclick="S.t=null;draw()">← Все преподаватели</button><h2>${esc(tn(S.t))}</h2>${G.filter(g=>g.t==S.t).map(g=>`<button class="row" onclick="S.g=${g.id};draw()"><span>${esc(g.n)} <span class="muted">${esc(g.season)}</span></span><span class="muted">${activeIn(g.id).length} уч.</span></button>`).join('')||'<p class="muted">Групп нет</p>'}</section>`;
return `<h1>Преподаватели</h1><div class="cols" style="margin-top:14px">${T.map(x=>`<button class="card row" style="border:1px solid var(--line)" onclick="S.t=${x.id}; draw()"><span><b>${esc(x.n)}</b><br><span class="muted">${G.filter(g=>g.t==x.id).length} групп</span></span><span class="muted">${new Set(EN.filter(e=>e.st=='active'&&(gById(e.g)||{}).t==x.id).map(e=>e.k)).size} уч.</span></button>`).join('')||'<p class="muted">Преподавателей пока нет</p>'}</div>`}
if(t=='pay')return payView()}


/* ===== список групп: поиск и «только сегодняшние» ===== */
const DAYS=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const slotTxt=(d,t)=>{if(!d)return '';const x=new Date(d+'T12:00:00'),w=DAYS[x.getDay()];return d.slice(8)+'.'+d.slice(5,7)+' '+w[0].toUpperCase()+w.slice(1)+(t?' '+t:'')};
const parseSlots=t=>{const r=[],y=new Date().getFullYear();for(const m of String(t||'').matchAll(/(\d{2})\.(\d{2})\s+[А-Яа-яЁё]+\s+(\d{1,2}:\d{2})/g)){const [h,mi]=m[3].split(':');r.push({d:y+'-'+m[2]+'-'+m[1],h:h.padStart(2,'0'),m:mi})};return r};
const DRX=/(?:^|[^а-яё])(пн|пон[а-яё]*|вт|втор[а-яё]*|ср|сред[а-яё]*|чт|чет[а-яё]*|пт|пят[а-яё]*|сб|суб[а-яё]*|вс|воск[а-яё]*)(?![а-яё])/g;
const DIDX=w=>w[0]=='п'?(w[1]=='н'||w[1]=='о'?1:5):w[0]=='в'?(w[1]=='т'?2:0):w[0]=='с'?(w[1]=='р'?3:6):w[0]=='ч'?4:-1;
const schedDays=t=>{const r=new Set();for(const m of String(t||'').toLowerCase().matchAll(DRX)){const i=DIDX(m[1]);if(i>=0)r.add(i)}return r};
const schedTime=t=>{const m=String(t||'').match(/(\d{1,2})[:.](\d{2})/);return m?+m[1]*60+ +m[2]:9999};
function groupsRes(){if(!G.length)return '<p class="muted">Групп пока нет</p>';
const w=S.gfq.toLowerCase().split(/\s+/).filter(Boolean),td=new Date().getDay();let l,info;
if(w.length){l=G.filter(g=>{const h=(tn(g.t)+' '+g.n+' '+g.season+' '+g.s+' '+g.loc).toLowerCase();return w.every(x=>h.includes(x))});info='Найдено групп: '+l.length}
else if(S.ga){l=G.slice();info='Все группы: '+l.length}
else{l=G.filter(g=>{const d=schedDays(g.s);return !d.size||d.has(td)});info='Сегодня, '+DAYS[td]+': '+l.length+(G.length>l.length?' · остальные ('+(G.length-l.length)+') найдите через поиск':'')}
if(w.length||S.ga)l.sort((a,b)=>COL.compare(tn(a.t),tn(b.t))||COL.compare(a.n,b.n));else l.sort((a,b)=>schedTime(a.s)-schedTime(b.s)||COL.compare(tn(a.t),tn(b.t)));
return `<div class="pgrow"><p class="muted">${esc(info)}</p>${w.length?'':`<button class="lnk" onclick="S.ga=!S.ga;gr()">${S.ga?'Только сегодняшние':'Показать все группы'}</button>`}</div>`
+(l.map(g=>`<button class="row" onclick="S.g=${g.id};draw()"><span>${esc(tn(g.t))} · ${esc(g.n)}${g.s?`<br><span class="muted">${esc(g.s)}</span>`:''}</span><span class="muted">${esc(g.season)} · ${activeIn(g.id).length} уч.</span></button>`).join('')||'<p class="muted">'+(w.length?'Ничего не нашли':'На сегодня групп нет. Остальные — через поиск или «Показать все группы».')+'</p>')}
const gr=()=>{const e=$('gres');if(e)e.innerHTML=groupsRes()};

/* ===== вкладка «Ученики»: таблица, одна строка = запись ученика в группе ===== */
function kidsView(ad,only){const qw=S.tq.toLowerCase().split(/\s+/).filter(Boolean),cq=S.tc.trim().toLowerCase(),a1=S.a1===''?null:+S.a1,a2=S.a2===''?null:+S.a2,ro=ad?'':' readonly';
const _a=new Map(),AG={get:id=>{let v=_a.get(id);if(v===undefined){v=ageOf(kById(id));_a.set(id,v)}return v}};const by={};EN.forEach(e=>(by[e.k]=by[e.k]||[]).push(e));let rs=[];K.forEach(k=>(by[k.id]||[null]).forEach(e=>rs.push([k,e])));
const seasons=[...new Set(EN.map(e=>e.season).filter(Boolean))].sort();
rs=rs.filter(([k,e])=>{const p=pById(k.pg)||{};
if(qw.length){const h=(k.n+' '+(p.n||'')+' '+(p.ph||'')+' '+k.tel+' '+(p.em||'')+' '+(e?e.note+' '+e.tn:'')).toLowerCase();for(const x of qw)if(!h.includes(x))return false}
if(cq){const c=e?e.cn:'',lead=(c.match(/^\s*(\d+)/)||[])[1]||'';if(/^\d+$/.test(cq)?!lead.startsWith(cq):!c.toLowerCase().includes(cq))return false}
if(S.tf==-1?e:(S.tf&&(!e||e.g!=S.tf)))return false;if(S.tt&&!(e&&(gById(e.g)||{}).t==S.tt))return false;
if(S.ty&&(!e||e.season!==S.ty))return false;if(S.tst&&(!e||e.st!==S.tst))return false;
if(a1!=null||a2!=null){const a=AG.get(k.id);if(a==='')return false;if(a1!=null&&a<a1)return false;if(a2!=null&&a>a2)return false}return true});
const ao=k=>AG.get(k.id)===''?999:AG.get(k.id),glc=new Map(),gl=r=>{if(!r[1])return '';let v=glc.get(r[1].g);if(v==null){v=gn(r[1].g);glc.set(r[1].g,v)}return v};
const cmp={az:(a,b)=>COL.compare(a[0].n,b[0].n),za:(a,b)=>COL.compare(b[0].n,a[0].n),ageup:(a,b)=>ao(a[0])-ao(b[0]),agedown:(a,b)=>(AG.get(b[0].id)===''?-1:AG.get(b[0].id))-(AG.get(a[0].id)===''?-1:AG.get(a[0].id)),grp:(a,b)=>COL.compare(gl(a),gl(b))}[S.ts];rs=rs.slice().sort(cmp);
const per=S.pp||rs.length||1,pages=Math.max(1,Math.ceil(rs.length/per));S.tp=Math.min(S.tp,pages-1);
const pager=`<div class="pg"><button class="btn ghost" ${S.tp?'':'disabled'} onclick="S.tp--;kr()">←</button><span class="muted">Стр. ${S.tp+1} из ${pages}</span><button class="btn ghost" ${S.tp<pages-1?'':'disabled'} onclick="S.tp++;kr()">→</button></div>`;
const ta=(k,e,f,w,lb,val,multi)=>`<textarea class="ta" rows="1" style="min-width:${w}px" aria-label="${lb}" onchange="edit(${k.id},${e?e.id:0},'${f}',this.value)" oninput="grow(this)" ${multi?'':`onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"`}${ro}>${esc(val)}</textarea>`,
dc=(k,e,f,val,lb)=>`<input type="date" value="${esc(val)}" onchange="edit(${k.id},${e?e.id:0},'${f}',this.value)" aria-label="${lb}"${ro}>`,
opt=(arr,cur)=>arr.map(y=>`<option ${y==cur?'selected':''}>${esc(y)}</option>`).join('');
const res=`<div class="pgrow"><p class="muted">Найдено: ${rs.length}${(a1!=null||a2!=null)?' (если возраст неизвестен, строка скрыта)':''}</p>${pager}</div>
<div class="scroll"><table class="ed"><thead><tr><th></th><th>Статус</th><th>ФИО ученика</th><th>Дата рождения</th><th>Возраст</th><th>Телефон ученика</th><th>Родитель</th><th>Телефон родителя</th><th>E-mail родителя</th><th>Преподаватель</th><th>Группа</th><th>Сезон</th><th>№ договора</th><th>Дата договора</th><th>Дата пробного</th><th>Заметка к пробному</th><th>Примечания</th></tr></thead><tbody>${rs.slice(S.tp*per,S.tp*per+per).map(([k,e])=>{const p=pById(k.pg)||{n:'',ph:'',em:''},g=e&&gById(e.g),en=(f,w,lb,val,m)=>e?ta(k,e,f,w,lb,val,m):'<span class="muted">—</span>';
return `<tr><td data-label=""><button class="btn cbtn" onclick="openK(${k.id})">Карточка</button></td>
<td data-label="Статус">${e?`<select onchange="edit(${k.id},${e.id},'st',this.value)" aria-label="Статус"${ad?'':' disabled'}>${Object.keys(ST).map(s=>`<option value="${s}" ${e.st==s?'selected':''}>${ST[s]}</option>`).join('')}</select>`:'<span class="muted">—</span>'}</td>
<td data-label="ФИО">${ta(k,e,'n',230,'ФИО ученика',k.n)}</td>

/* ===== оплаты ===== */
function lines(k){const X=getAX(),gs=[...new Set(EN.filter(e=>e.k==k.id).map(e=>e.g).concat([...(X.bk.get(+k.id)||[])]))].filter(g=>gById(g));
const rows=gs.map(g=>{const ds=[],mm=X.kg.get(k.id+'|'+g);if(mm)for(const [d,v] of mm)if(v===1&&d>=S.from&&d<=S.to)ds.push(d);const sum=ds.reduce((s,d)=>s+priceOn(g,d),0);return [gn(g),ds.length,ds.length?+(sum/ds.length).toFixed(2):curPrice(gById(g)),+sum.toFixed(2),ds.sort()]}).filter(r=>r[1]>0||true);
return {rows,total:+rows.reduce((s,r)=>s+r[3],0).toFixed(2)}}
const payTotal=L=>{const v=parseFloat(String(S.amt).replace(',','.'));return S.amt!==''&&v>=0?v:L.total};
const pqMatches=()=>{const w=S.pq.toLowerCase().split(/\s+/).filter(Boolean);if(!w.length)return [];return K.filter(x=>{const h=(x.n+' '+((pById(x.pg)||{}).n||'')).toLowerCase();return w.every(t=>h.includes(t))}).sort((a,b)=>COL.compare(a.n,b.n))};
const pqList=()=>{if(!S.pq.trim())return '';const r=pqMatches();if(!r.length)return '<p class="muted">Никого не нашли</p>';
return '<div style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin:6px 0">'+r.slice(0,30).map(x=>`<button class="row" onclick="pickKid(${x.id})"><span>${esc(x.n)}</span><span class="muted">${esc(EN.filter(e=>e.k==x.id&&e.st=='active').map(e=>(gById(e.g)||{}).n).join(', '))}</span></button>`).join('')+(r.length>30?`<p class="muted" style="padding:6px 10px;margin:0">Показаны первые 30 из ${r.length}: уточните запрос</p>`:'')+'</div>'};
const pqr=()=>{const e=$('pqres');if(e)e.innerHTML=pqList()};
const pickKid=id=>{S.pk=id;S.amt='';S.pq='';draw()};
const pqPick=()=>{const r=pqMatches();if(r.length)pickKid(r[0].id)};
function payView(){if(!ATT_OK)return '<h1>Оплаты</h1>'+attWait();const k=kById(S.pk);if(!k)return '<h1>Оплаты</h1><p class="muted">Нет учеников</p>';const L=lines(k);
return `<h1>Оплаты</h1><section class="card"><div class="bar"><input id="pq" type="search" value="${esc(S.pq)}" placeholder="Найти ученика: ФИО или родитель" autocomplete="off" aria-label="Поиск ученика" style="flex:1;min-width:240px" oninput="S.pq=this.value;pqr()" onkeydown="if(event.key==='Enter')pqPick()"><label>с <input type="date" value="${S.from}" onchange="S.from=this.value;S.amt='';draw()"></label><label>по <input type="date" value="${S.to}" onchange="S.to=this.value;S.amt='';draw()"></label></div>
<div id="pqres">${pqList()}</div>
<p style="margin:10px 0"><span class="muted">Ученик:</span> <b>${esc(k.n)}</b></p>
<div class="scroll"><table><thead><tr><th>Группа</th><th class="num">Занятий</th><th class="num">Цена</th><th class="num">Сумма</th></tr></thead><tbody>${L.rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="num">${r[1]}</td><td class="num">${r[2]} BYN</td><td class="num">${r[3]} BYN</td></tr>`).join('')||'<tr><td colspan="4" class="muted">У ученика нет групп</td></tr>'}<tr><td colspan="3"><b>Рассчитано по посещаемости</b></td><td class="num"><b>${L.total} BYN</b></td></tr></tbody></table></div>
<div class="bar" style="align-items:end"><label class="muted">Сумма к оплате в чеке, BYN<br><input id="amt" inputmode="decimal" value="${S.amt!==''?esc(S.amt):L.total}" oninput="S.amt=this.value" style="width:150px"></label><button class="btn" onclick="pdf()">Скачать PDF</button></div></section>`}
async function pdf(){const k=kById(S.pk);if(!k)return;try{await loadPdf()}catch(e){return toast(e.message)}
const L=lines(k),p=pById(k.pg)||{},total=payTotal(L),rows=L.rows.filter(r=>r[1]>0),cnt=rows.reduce((s,r)=>s+r[1],0);
const c='padding:7px 8px;border-bottom:1px solid #ccc;',h='padding:7px 8px;border-bottom:2px solid #333;',ln=(a,b)=>b?`<div style="margin:2px 0"><span style="color:#555">${a}:</span> <b>${esc(b)}</b></div>`:'';
const el=document.createElement('div');el.style.cssText='width:680px;padding:36px;background:#fff;color:#000;font-family:Arial,sans-serif;font-size:14px;line-height:1.4;box-sizing:border-box';
el.innerHTML=`<div style="font-size:22px;font-weight:bold">Dance UP Studio</div><div style="font-size:16px;margin:2px 0 18px">Счёт на оплату занятий</div>`
+ln('Ученик',k.n)+ln('Дата рождения',k.dobI?fmt(k.dobI):k.bdr)+ln('Телефон ученика',k.tel)+ln('Родитель',p.n)+ln('Телефон родителя',p.ph)+ln('E-mail родителя',p.em)+ln('Период',fmt(S.from)+' — '+fmt(S.to))+ln('Дата формирования',fmt(today()))
+`<table style="width:100%;min-width:0;border-collapse:collapse;margin-top:18px"><thead><tr><th style="${h}text-align:left">Группа</th><th style="${h}text-align:center">Занятий</th><th style="${h}text-align:center">Цена</th><th style="${h}text-align:right">Сумма</th></tr></thead><tbody>`
+(rows.map(r=>`<tr><td style="${c}">${esc(r[0])}</td><td style="${c}text-align:center">${r[1]}</td><td style="${c}text-align:center">${r[2]} BYN</td><td style="${c}text-align:right">${r[3]} BYN</td></tr><tr><td colspan="4" style="${c}font-size:12px;color:#555">Даты занятий: ${r[4].map(fmt).join(', ')}</td></tr>`).join('')||`<tr><td colspan="4" style="${c}color:#555">За выбранный период посещённых занятий нет</td></tr>`)
+`</tbody></table><div style="margin-top:18px;text-align:right"><div>Всего занятий: <b>${cnt}</b></div><div>Рассчитано по посещаемости: <b>${L.total} BYN</b></div>${total!==L.total?'<div style="color:#555">Сумма скорректирована вручную</div>':''}<div style="font-size:20px;font-weight:bold;margin-top:8px">Итого к оплате: ${total} BYN</div></div>`;
const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-10000px;top:0';wrap.appendChild(el);document.body.appendChild(wrap);
try{await html2pdf().set({margin:8,filename:`Оплата_${k.n}_${S.from}_${S.to}.pdf`,image:{type:'jpeg',quality:.98},html2canvas:{scale:2,scrollX:0,scrollY:0,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4'},pagebreak:{avoid:'tr'}}).from(el).save();toast('PDF сохранён')}
catch(e){toast('Не удалось создать PDF: '+((e&&e.message)||e))}finally{wrap.remove()}}

/* ===== карточка ученика ===== */
function drawer(){const d=$('drawer'),k=kById(S.drawer);d.classList.toggle('open',!!k);$('dback').classList.toggle('open',!!k);if(!k)return;const ad=IS_ADMIN(),p=pById(k.pg),v=x=>x?esc(x):'<span class="muted">—</span>',row=(l,h)=>`<dt>${l}</dt><dd>${h}</dd>`;
const es=EN.filter(e=>e.k==k.id);
d.innerHTML=`<h2>${esc(k.n)}</h2><dl>`+row('Дата рождения',k.dobI?fmt(k.dobI)+(k.bdr?` <span class="muted">(${esc(k.bdr)})</span>`:''):v(k.bdr))+row('Возраст',ageOf(k)===''?v(''):ageOf(k))+row('Телефон ученика',v(k.tel))+row('Родитель',v(p&&p.n))+row('Телефон родителя',p?v(p.ph)+(p.pr&&p.pr!==p.ph?` <span class="muted">(${esc(p.pr)})</span>`:''):v(''))+row('E-mail родителя',v(p&&p.em))+`</dl>`
+es.map(e=>{const g=gById(e.g);return g?`<div class="card" style="margin:10px 0;padding:12px"><dl style="margin:0">${row('Группа',`<button class="lnk" onclick="go('groups',{g:${e.g}})">${esc(g.n)}</button>, <button class="lnk" onclick="go('teachers',{t:${g.t},g:null})">${esc(tn(g.t))}</button>`)}${row('Статус',ST[e.st]||esc(e.st))}${row('Сезон',v(e.season))}${row('Договор',v(e.cn)+(e.cd?' от '+fmt(e.cd):''))}${row('Пробное',v(e.td?fmt(e.td):'')+(e.tn?` <span class="muted">(${esc(e.tn)})</span>`:''))}${row('Примечания',v(e.note))}${row('Источник',`<span class="muted">${esc(e.ref||'—')}</span>`)}</dl>${ad&&e.st=='active'?`<button class="lnk" onclick="rmFromGroup(${k.id},${e.g})">убрать из группы</button>`:''}</div>`:''}).join('')
+(ad?`<select style="width:100%;margin:10px 0" aria-label="Добавить в группу" onchange="if(this.value)addToGroup(${k.id},+this.value)"><option value="">+ Добавить в группу…</option>${G.filter(x=>!EN.some(e=>e.k==k.id&&e.g==x.id&&e.st=='active')).map(x=>`<option value="${x.id}">${esc(gn(x.id))}</option>`).join('')}</select>`:'')+`<div style="display:flex;gap:10px;margin:10px 0 0">${ad?`<button class="btn" style="flex:1" onclick="go('pay',{pk:${k.id},amt:''})">Оплата и PDF</button>`:''}<button class="btn ghost" style="flex:1" onclick="S.drawer=null;drawer()">Закрыть</button></div>`}

/* ===== добавление ученика ===== */
function openAdd(){const f=(id,lb,ty,ph)=>`<label>${lb}<input id="${id}" type="${ty||'text'}" ${ph?`placeholder="${ph}"`:''}></label>`;
$('modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeAdd()"><div class="mdl" role="dialog" aria-modal="true" aria-label="Новый ученик"><h2>Новый ученик</h2>
${f('m_n','ФИО ученика *')}${f('m_dob','Дата рождения','date')}${f('m_tel','Телефон ученика (для взрослых групп)')}${f('m_gn','Родитель (ФИО)')}${f('m_gp','Телефон родителя','text','+375...')}${f('m_ge','E-mail родителя','email')}
<label>Группа<select id="m_g"><option value="">Без группы</option>${G.map(g=>`<option value="${g.id}">${esc(gn(g.id))}</option>`).join('')}</select></label>
<label>Статус в группе<select id="m_st">${Object.keys(ST).map(s=>`<option value="${s}">${ST[s]}</option>`).join('')}</select></label>
${f('m_cn','Номер договора')}${f('m_cd','Дата договора','date')}${f('m_td','Дата пробного занятия','date')}${f('m_tn','Заметка к пробному')}<label>Примечания<textarea id="m_note" rows="3"></textarea></label>
<div class="bar" style="margin:6px 0 0"><button class="btn big" onclick="saveKid()">Сохранить</button><button class="btn ghost" onclick="closeAdd()">Отмена</button></div></div></div>`;$('m_n').focus&&$('m_n').focus()}
const closeAdd=()=>{$('modal').innerHTML=''};
document.addEventListener&&document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAdd();if(S.drawer){S.drawer=null;drawer()}}});
async function saveKid(){const v=id=>($(id).value||'').trim(),n=v('m_n');if(!n)return toast('Введите ФИО');
if(K.some(k=>k.n.trim().toLowerCase()==n.toLowerCase())&&!confirm('Ученик с таким ФИО уже есть. Всё равно добавить?'))return;
let guardian=null;if(v('m_gn')||v('m_gp')||v('m_ge')){const r=await sb.from('guardians').insert({full_name:v('m_gn')||null,phone:v('m_gp')||null,email:v('m_ge')||null}).select('id').single();if(r.error)return toast('Не сохранено: '+r.error.message);guardian=r.data.id}
const {data,error}=await sb.from('students').insert({full_name:n,birth_date:v('m_dob')||null,phone:v('m_tel')||null,guardian_id:guardian}).select('id').single();if(error)return toast('Не сохранено: '+error.message);
let pg=0;if(guardian){pg=P.reduce((m,x)=>Math.max(m,x.id),0)+1;PU[pg]=guardian;P.push({id:pg,n:v('m_gn'),ph:v('m_gp'),pr:'',em:v('m_ge')})}
const id=K.reduce((m,k)=>Math.max(m,k.id),0)+1;KU[id]=data.id;K.push({id,n,dobI:v('m_dob'),bdr:'',tel:v('m_tel'),pg});
const gid=+$('m_g').value||0;if(gid){const g=gById(gid),prim=true;const r=await sb.from('enrollments').insert({student_id:data.id,group_id:GU[gid],season:g.season,status:v('m_st')||'active',is_primary:prim,contract_number:v('m_cn')||null,contract_date:v('m_cd')||null,trial_date:v('m_td')||null,trial_note:v('m_tn')||null,notes:v('m_note')||null}).select('id').single();
if(r.error)toast('Ученик добавлен, но в группу не записан: '+r.error.message);else{const eid=EN.reduce((m,e)=>Math.max(m,e.id),0)+1;EN.push({id:eid,u:r.data.id,k:id,g:gid,season:g.season,prim,st:v('m_st')||'active',cn:v('m_cn'),cd:v('m_cd'),td:v('m_td'),tn:v('m_tn'),note:v('m_note'),ref:''});EU[id+'|'+gid]=r.data.id}}
closeAdd();Object.assign(S,{tab:'kids',tq:n,tc:'',a1:'',a2:'',ty:'',tst:'',tt:0,tf:0,tp:0});draw();toast('Ученик добавлен')}

/* ===== вход, загрузка, отрисовка ===== */
const SETUP=`<section class="card" style="max-width:560px;margin:40px auto"><h2>Сайт не подключён к базе данных</h2><p>Здесь нет тестовых данных: все ученики, группы и преподаватели хранятся в вашем Supabase. Чтобы начать работу, создайте файл <b>config.js</b> рядом с index.html (образец: config.example.js) и впишите адрес проекта и ключ anon. Шаги описаны в ИНСТРУКЦИЯ.md.</p></section>`;
const LOGIN=`<section class="card" style="max-width:360px;margin:40px auto"><h2>Вход</h2><div class="bar" style="flex-direction:column;align-items:stretch"><input id="le" type="email" placeholder="E-mail" autocomplete="username"><input id="lp" type="password" placeholder="Пароль" autocomplete="current-password"><button class="btn" onclick="login()">Войти</button></div></section>`;
function draw(keep){reindex();if(!window.sb){$('nav').innerHTML='';$('v').innerHTML=SETUP;return}if(!ME){$('nav').innerHTML='';$('v').innerHTML=LOGIN;drawer();return}
const a=document.activeElement,id=a&&a.id;$('nav').innerHTML=TABS.filter(t=>IS_ADMIN()||t[0]!='pay').map(t=>`<button class="${t[0]==S.tab?'on':''}" onclick="go('${t[0]}',{t:null,g:null})">${t[1]}</button>`).join('')+'<button onclick="logout()">Выйти</button>';
$('v').innerHTML=view();drawer();if(document.querySelectorAll)growAll();
if(keep&&id){const e=$(id);if(e){e.focus();try{e.setSelectionRange(99,99)}catch(_){}}}}
async function all(t,sel,ord){const PS=1000,q=(c,a,b)=>[].concat(ord).reduce((x,o)=>x.order(o),sb.from(t).select(sel,c)).range(a,b);
const f=await q({count:'exact'},0,PS-1);if(f.error)throw f.error;let o=f.data;const n=f.count||0;
if(n>PS){const js=[];for(let a=PS;a<n;a+=PS)js.push(q(undefined,a,a+PS-1));for(const r of await Promise.all(js)){if(r.error)throw r.error;o=o.concat(r.data)}}return o}
const fetchAll=()=>Promise.all([all('teachers','id,full_name','id'),all('groups','id,name,teacher_id,season,location,schedule','id'),all('group_prices','group_id,price,valid_from','id'),all('guardians','id,full_name,phone,phone_raw,email','id'),all('students','id,full_name,birth_date,birth_date_raw,phone,guardian_id','id'),all('enrollments','id,student_id,group_id,season,is_primary,status,contract_number,contract_date,trial_date,trial_note,notes,source_ref','id')]);
const fetchAtt=()=>all('attendance','present,enrollments(student_id,group_id),lessons(id,group_id,lesson_date)',['lesson_id','enrollment_id']);
function build([t,g,gp,pa,s,e]){
const ti={},gi={},pi={},ki={};TU={};GU={};PU={};KU={};EU={};LS={};A={};KI=ki;GI=gi;AX=null;ATT_OK=false;ATT_ERR=false;
T=t.map((x,i)=>(ti[x.id]=i+1,TU[i+1]=x.id,{id:i+1,n:x.full_name}));
const ph={};gp.sort((a,b)=>a.valid_from<b.valid_from?-1:1).forEach(x=>(ph[x.group_id]=ph[x.group_id]||[]).push({f:x.valid_from,p:+x.price}));
G=g.filter(x=>IS_ADMIN()||x.teacher_id==ME.teacher_id).map((x,i)=>{gi[x.id]=i+1;GU[i+1]=x.id;const h=ph[x.id]||[],o={id:i+1,t:ti[x.teacher_id],n:x.name,season:x.season||'',s:x.schedule||'',loc:x.location||'',ph:h,p:0};o.p=curPrice(o);return o});
P=pa.map((x,i)=>(pi[x.id]=i+1,PU[i+1]=x.id,{id:i+1,n:x.full_name||'',ph:x.phone||'',pr:x.phone_raw||'',em:x.email||''}));
K=s.map((x,i)=>(ki[x.id]=i+1,KU[i+1]=x.id,{id:i+1,n:x.full_name,dobI:x.birth_date||'',bdr:x.birth_date_raw||'',tel:x.phone||'',pg:pi[x.guardian_id]||0}));
EN=[];e.forEach((x,i)=>{const gg=gi[x.group_id],kk=ki[x.student_id];if(!gg||!kk)return;const o={id:i+1,u:x.id,k:kk,g:gg,season:x.season||'',prim:x.is_primary,st:x.status,cn:x.contract_number||'',cd:x.contract_date||'',td:x.trial_date||'',tn:x.trial_note||'',note:x.notes||'',ref:x.source_ref||''};EN.push(o);EU[kk+'|'+gg]=x.id});
if(!IS_ADMIN()){const mine=new Set(EN.map(e=>e.k));K=K.filter(k=>mine.has(k.id))}reindex()}
function buildAtt(at){if(!ME)return;for(const x of at){const en=x.enrollments,l=x.lessons;if(!en||!l)continue;const k=KI[en.student_id],gg=GI[en.group_id];if(k&&gg){const key=k+'|'+gg+'|'+l.lesson_date;if(!(key in A))A[key]=x.present?1:0;const lk=gg+'|'+l.lesson_date;if(!LS[lk])LS[lk]=l.id}}AX=null;getAX();ATT_OK=true}
async function start(){const {data:{session}}=await sb.auth.getSession();if(!session){draw();return}
$('v').innerHTML='<p class="muted" style="padding:24px">Загрузка…</p>';
const [pr,ld]=await Promise.allSettled([sb.from('profiles').select('role,teacher_id').eq('id',session.user.id).maybeSingle(),fetchAll()]);
const data=pr.status=='fulfilled'?pr.value.data:null;
if(!data){toast('Профиль не создан: обратитесь к администратору');await sb.auth.signOut();draw();return}
ME=data;if(ld.status=='fulfilled'){try{build(ld.value)}catch(e){toast('Ошибка загрузки: '+e.message)}}else toast('Ошибка загрузки: '+((ld.reason&&ld.reason.message)||ld.reason))
S.ad=today();S.pk=(K[0]||{}).id||0;S.tab=IS_ADMIN()?'kids':'groups';draw();
const attP=fetchAtt();
attP.then(at=>{buildAtt(at);if(S.tab=='pay'||S.gv=='att')draw()}).catch(e=>{ATT_ERR=true;toast('Ошибка загрузки посещаемости: '+e.message);if(S.tab=='pay'||S.gv=='att')draw()})}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$('le').value,password:$('lp').value});if(error)return toast('Неверный e-mail или пароль');start()}
async function logout(){await sb.auth.signOut();ME=null;draw()}
document.addEventListener('DOMContentLoaded',()=>{window.sb?start():draw()});

</script></body></html>
